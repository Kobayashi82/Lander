name: Publicar versión

# Al subir una etiqueta como v1.0.0 se compila, se prueba y se crea una versión en GitHub con el
# ejecutable autónomo (Lander.exe, no necesita instalar .NET).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publicar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Versión
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test --project tests/Lander.Core.Tests/Lander.Core.Tests.csproj --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Publicar el ejecutable
        run: dotnet publish src/Lander.App/Lander.App.csproj -p:PublishProfile=win-x64-standalone -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true

      - name: Crear la versión
        uses: softprops/action-gh-release@v2
        with:
          name: Lander ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: artifacts/publish/win-x64-standalone/Lander.exe
